services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asgrid}
      POSTGRES_DB: ${POSTGRES_DB:-asgrid}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asgrid}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: